<!DOCTYPE html> 

<html lang ="en">

<head>

<metacharset = "UTF-8">
<meta name "viewport" content "width = device-width, initial-scale =1.0">

<title>The Box Model</title>
<link rel="stylesheet" href="style.css">
</head>


<body>

<div class="box content-box">
    <h2>content-box</h2>
    <p>width : 200px<br>
       padding : 20px<br>
       border : 5px<br>
       Total width = 200 + 40 padding + 10 border = 250px
    </p>
</div>

<div class="box border-box">
    <h2>border-box</h2>
    <p>width : 200px<br>
       padding : 20px<br>
       border : 5px<br>
       Total width = 150 + 40 padding + 10 border = 200px
    </p>
</div>

</body>


</html>
